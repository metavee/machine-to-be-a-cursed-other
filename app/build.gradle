plugins {
    id 'com.android.application'
}

android {
    namespace 'io.github.metavee.machinetobeanother'
    compileSdk 34

    defaultConfig {
        applicationId "io.github.metavee.machinetobeanother"
        // Raised from the original API 19 to the minimum supported by the modern
        // AndroidX libraries. Still covers essentially every device in use today.
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    signingConfigs {
        release {
            // Real release-signing credentials are supplied through environment
            // variables in CI (see .github/workflows/android.yml). When they are
            // absent — local builds, or before any signing secrets are added to
            // the repo — the release build falls back to the debug signing key
            // below, so the produced APK is still installable for sideloading.
            def storeFilePath = System.getenv("RELEASE_STORE_FILE")
            if (storeFilePath) {
                storeFile file(storeFilePath)
                storePassword System.getenv("RELEASE_STORE_PASSWORD")
                keyAlias System.getenv("RELEASE_KEY_ALIAS")
                keyPassword System.getenv("RELEASE_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Use the real release key when its credentials are present,
            // otherwise sign with the debug key so the APK still installs.
            signingConfig System.getenv("RELEASE_STORE_FILE") ? signingConfigs.release : signingConfigs.getByName("debug")
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildToolsVersion '34.0.0'
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    // Stereo rendering and Cardboard viewer calibration are handled by a small
    // in-app renderer (see TextureTestActivity / CardboardProfile) — no VR SDK.

    // Camera preview + frame analysis for the in-app viewer-calibration QR scanner
    // (QrScanActivity). Pinned to the CameraX 1.3.x line: 1.3.4 compiles against SDK 34;
    // 1.4.x requires compileSdk 35, which this module is not on. Keep all four artifacts
    // on the same version.
    implementation 'androidx.camera:camera-core:1.3.4'
    implementation 'androidx.camera:camera-camera2:1.3.4'
    implementation 'androidx.camera:camera-lifecycle:1.3.4'
    implementation 'androidx.camera:camera-view:1.3.4'
    // ML Kit barcode scanning, on-device BUNDLED model (no Play Services download): decodes
    // the Cardboard viewer QR so the profile can be scanned instead of pasted.
    implementation 'com.google.mlkit:barcode-scanning:17.3.0'

    // The CameraX/ML Kit graph transitively brings both the modern kotlin-stdlib (which since
    // Kotlin 1.8 absorbed the jdk7/jdk8 stdlib classes) and older kotlin-stdlib-jdk7/jdk8
    // artifacts, which collide as duplicate classes. Align the jdk7/jdk8 artifacts to 1.8.22,
    // where they are empty stubs that just depend on kotlin-stdlib.
    // See https://d.android.com/r/tools/classpath-sync-errors
    constraints {
        implementation('org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22') {
            because 'Avoid duplicate Kotlin stdlib classes on the CameraX/ML Kit classpath'
        }
        implementation('org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22') {
            because 'Avoid duplicate Kotlin stdlib classes on the CameraX/ML Kit classpath'
        }
    }
}
